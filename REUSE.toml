# Catch-all REUSE annotations so whole trees are covered without per-file
# headers. Per-file SPDX headers still win where present. See the handbook's licensing.md.
version = 1

SPDX-PackageName = "transcriber"
SPDX-PackageSupplier = "Gary Frattarola <garyf@parkviewlab.ai>"

# --- Documentation → CC-BY-4.0 ---------------------------------------------
[[annotations]]
path = ["docs/**", "README.md", "LICENSING.md", "CHANGELOG.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "CC-BY-4.0"

# --- Code, build scripts, configs, version pin → AGPL-3.0-or-later ----------
[[annotations]]
path = ["LICENSE", "VERSION.txt", ".gitignore", ".github/**", "AGENTS.md", "CLAUDE.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# --- The app icon and its sources -> all rights reserved ---------------------
[[annotations]]
path = ["brand/app-icon/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Gary Frattarola <garyf@parkviewlab.ai>"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# --- Third-party licence texts, shown in the Open Source Licenses window ------
[[annotations]]
path = ["legal/whisper.cpp-and-ggml-LICENSE.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023-2026 The ggml authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["legal/openai-whisper-LICENSE.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 OpenAI"
SPDX-License-Identifier = "MIT"
