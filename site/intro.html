<p>Transcriber is a small macOS app that transcribes audio and video locally with whisper.cpp, and can polish and summarise the text with a local language model. Nothing leaves the Mac.</p>
<p><a href="downloads/">Download Transcriber</a> for an Apple silicon Mac running macOS 13 or later.</p>
